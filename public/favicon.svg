<!--
  Vouken Technology brand mark - identical artwork to src/components/Logo.tsx.

  The tile is full-bleed (no transparent corners) so this single file is valid
  both as a browser favicon (rel="icon") and as a maskable web app manifest
  icon; the mark itself stays inside the maskable safe zone.

  Keep this artwork in sync with src/components/Logo.tsx when the mark changes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Vouken Technology">
  <defs>
    <filter id="logo-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="-3" dy="5" stdDeviation="3.5" flood-color="#28231f" flood-opacity="0.55" />
    </filter>
  </defs>
  <!-- The logo tile fill plus its 1px (per 36px tile) border-strong hairline. -->
  <rect x="1.39" y="1.39" width="97.22" height="97.22" fill="#aaa39b" stroke="#2c3432" stroke-width="2.78" />
  <g filter="url(#logo-shadow)">
    <path d="M21 24h16l21 53H42L21 24Z" fill="#f5f5f3" />
    <path d="M79 24H63L42 77h16l21-53Z" fill="#26364d" />
    <path d="M51 57l7 20H42l-5-13 7 13 7-20Z" fill="#e2e5e6" />
  </g>
</svg>
