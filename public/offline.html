      padding: 40px 32px;

      background: #121615;
    }

      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 34px; height: 34px; fill: #b8e06d; }
    .eyebrow {
      font-family: "DM Mono", ui-monospace, SFMono-Regular, monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .16em;
      color: #b8e06d;
    }
    h1 { margin: 14px 0 12px; font-size: 26px; font-weight: 800; letter-spacing: -.03em; }
    p { color: #a4ada6; line-height: 1.6; margin-bottom: 26px; font-size: 15px; }
    button {
      font: inherit;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 28px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: #b8e06d;
      color: #10170f;
      cursor: pointer;
      transition: transform .2s ease;
    }
    button:hover { transform: translateY(-1px); }
    button:focus-visible { outline: 2px solid #b8e06d; outline-offset: 3px; }
  </style>
